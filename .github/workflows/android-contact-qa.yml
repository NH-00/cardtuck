name: Android contact editor test
on:
  push:
    branches:
      - qa/android-contact-editor
permissions:
  contents: read
jobs:
  android-contact-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install official Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$RUNNER_TEMP/cardtuck-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          tools="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$tools" ]]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl --fail --silent --show-error --location https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 "$RUNNER_TEMP/android-tools.zip" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-cli"
            mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/cardtuck"
            tools="$ANDROID_HOME/cmdline-tools/cardtuck/bin/sdkmanager"
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "${tools%/*}" "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [[ ! -s "$ANDROID_HOME/licenses/android-sdk-license" ]]; then
            set +o pipefail
            yes | "$tools" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
            set -o pipefail
          fi
          "$tools" --sdk_root="$ANDROID_HOME" --install 'platform-tools' 'emulator' 'platforms;android-35' 'build-tools;35.0.1' 'system-images;android-35;default;x86_64'
          test -e /dev/kvm
          sudo chown "$USER" /dev/kvm
          printf 'no\n' | "${tools%/*}/avdmanager" create avd --force -n CardTuckTest -k 'system-images;android-35;default;x86_64'
      - name: Build and test the Android editor
        shell: bash
        run: bash mobile/android/qa-contact-editor.sh
