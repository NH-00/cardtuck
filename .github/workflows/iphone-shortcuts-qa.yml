name: iPhone Safari to Contacts test
on:
  push:
    branches:
      - qa/iphone-shortcuts
permissions:
  contents: read
jobs:
  ios-contact-editor:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the Xcode test project
        working-directory: mobile/iphone-qa
        shell: bash
        run: |
          if ! ruby -rxcodeproj -e 'abort unless Xcodeproj::VERSION == "1.27.0"'; then
            export GEM_PATH="$RUNNER_TEMP/cardtuck-gems:$(gem env path)"
            gem install xcodeproj --version 1.27.0 --install-dir "$RUNNER_TEMP/cardtuck-gems" --no-document
          fi
          ruby generate-project.rb
          xcodebuild -list -project CardTuckPhoneQA.xcodeproj
      - name: Build and open a fictional contact in Safari
        shell: bash
        run: |
          phone="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in reversed(list(d.items())) if "iOS-26-" in k for x in v if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          mkdir -p "$RUNNER_TEMP/cardtuck-fixture"
          cp 'public/mobile/CardTuck Add Contact.shortcut' "$RUNNER_TEMP/cardtuck-fixture/"
          node --input-type=module - > "$RUNNER_TEMP/cardtuck-fixture/index.html" <<'JS'
          import { contactHandoffUrl } from './src/lib/contact-handoff.ts';
          const contact = {
            name: "Maya Chen", firstname: "Maya", lastname: "Chen", title: "", company: "Studio Tidemark",
            phone: "+16045550142", email: "maya@tidemark.example", address: "", website: ""
          };
          const url = contactHandoffUrl("ios", contact).replaceAll("&", "&amp;");
          console.log('<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><p><a href="CardTuck%20Add%20Contact.shortcut" download>Download CardTuck shortcut</a></p><p><a href="' + url + '" target="_blank" rel="noopener noreferrer">Add to Contacts</a></p>');
          JS
          python3 - "$RUNNER_TEMP/cardtuck-fixture" > "$RUNNER_TEMP/contact-http.log" 2>&1 <<'PY' &
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import sys

          class FixtureHandler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  if self.path.endswith('.shortcut'):
                      self.send_header('Content-Disposition', 'attachment; filename="CardTuck Add Contact.shortcut"')
                  super().end_headers()

          ThreadingHTTPServer(('127.0.0.1', 8086), partial(FixtureHandler, directory=sys.argv[1])).serve_forever()
          PY
          xcrun simctl boot "$phone"
          xcrun simctl bootstatus "$phone" -b
          curl --retry 4 --retry-connrefused --fail --silent http://127.0.0.1:8086/ >/dev/null
          cd mobile/iphone-qa
          xcodebuild test -project CardTuckPhoneQA.xcodeproj -scheme CardTuckPhoneQA \
            -destination "platform=iOS Simulator,id=$phone,arch=$(uname -m)" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/cardtuck-iphone.xcresult"
      - name: Show the exact iPhone test result
        if: always()
        shell: bash
        run: |
          result="$RUNNER_TEMP/cardtuck-iphone.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result"
          fi
