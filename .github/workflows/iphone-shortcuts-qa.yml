name: iPhone Safari to Contacts test
on:
  push:
    branches:
      - qa/iphone-shortcuts
permissions:
  contents: read
jobs:
  ios-contact-editor:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and open a fictional contact in Safari
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          phone="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS-" in k for x in v if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          mkdir -p "$RUNNER_TEMP/cardtuck-fixture"
          node --input-type=module - > "$RUNNER_TEMP/cardtuck-fixture/index.html" <<'JS'
          import { contactHandoffUrl } from './src/lib/contact-handoff.ts';
          const contact = {
            name: "Maya Chen", firstname: "Maya", lastname: "Chen", title: "", company: "Studio Tidemark",
            phone: "+16045550142", email: "maya@tidemark.example", address: "", website: ""
          };
          const url = contactHandoffUrl("ios", contact).replaceAll("&", "&amp;");
          console.log('<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><a href="' + url + '" target="_blank" rel="noopener noreferrer">Add to Contacts</a>');
          JS
          python3 -m http.server 8086 --bind 127.0.0.1 --directory "$RUNNER_TEMP/cardtuck-fixture" > "$RUNNER_TEMP/contact-http.log" 2>&1 &
          xcrun simctl boot "$phone"
          xcrun simctl bootstatus "$phone" -b
          xcrun simctl openurl "$phone" http://127.0.0.1:8086/
          cd mobile/iphone-qa
          xcodegen generate
          xcodebuild test -scheme CardTuckPhoneQA -destination "id=$phone" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -quiet
