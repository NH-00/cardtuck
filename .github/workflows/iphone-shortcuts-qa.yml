name: iPhone Safari to Contacts test
on:
  push:
    branches:
      - qa/iphone-vcard
permissions:
  contents: read
jobs:
  ios-contact-editor:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the Xcode test project
        working-directory: mobile/iphone-qa
        shell: bash
        run: |
          if ! ruby -rxcodeproj -e 'abort unless Xcodeproj::VERSION == "1.27.0"'; then
            export GEM_PATH="$RUNNER_TEMP/cardtuck-gems:$(gem env path)"
            gem install xcodeproj --version 1.27.0 --install-dir "$RUNNER_TEMP/cardtuck-gems" --no-document
          fi
          ruby generate-project.rb
          xcodebuild -list -project CardTuckPhoneQA.xcodeproj
      - name: Build and open a fictional contact in Safari
        shell: bash
        run: |
          phone="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in reversed(list(d.items())) if "iOS-26-" in k for x in v if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          npx --yes --package=tsx@4.23.13 tsx mobile/iphone-qa/serve-preview.cjs > "$RUNNER_TEMP/contact-http.log" 2>&1 &
          xcrun simctl boot "$phone"
          xcrun simctl bootstatus "$phone" -b
          curl --retry 4 --retry-connrefused --fail --silent http://127.0.0.1:8086/ >/dev/null || { cat "$RUNNER_TEMP/contact-http.log"; exit 1; }
          cd mobile/iphone-qa
          xcodebuild test -project CardTuckPhoneQA.xcodeproj -scheme CardTuckPhoneQA \
            -destination "platform=iOS Simulator,id=$phone,arch=$(uname -m)" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/cardtuck-iphone.xcresult"
      - name: Show the exact iPhone test result
        if: always()
        shell: bash
        run: |
          result="$RUNNER_TEMP/cardtuck-iphone.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result"
          fi
