name: cardferry-production

services:
  app:
    build:
      context: .
      dockerfile: docker/dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:7658:80"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardferry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cardferry}
    volumes:
      - cardferry_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cardferry_postgres_data:
